spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none # 운영은 실수를 막기 위해 무조건 validate
    show-sql: false

  data:
    redis:
      host: ${PROD_REDIS_HOST}
      port: ${PROD_REDIS_PORT}
      password: ${PROD_REDIS_PASSWORD}

  mail:
    host: ${AWS_MAIL_HOST}
    port: ${AWS_MAIL_PORT}
    username: ${AWS_MAIL_USERNAME}
    password: ${AWS_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${AWS_MAIL_FROM}

cloud:
  s3:
    endpoint: ${PROD_S3_ENDPOINT}
    region: ${PROD_S3_REGION}
    bucket: ${PROD_S3_BUCKET}
    credentials:
      access-key: ${PROD_S3_KEY}
      secret-key: ${PROD_S3_SECRET}

jwt:
  secret: ${PROD_JWT_SECRET}
  expiration: ${PROD_JWT_EXPIRATION}
  refresh-expiration: ${PROD_JWT_REFRESH_EXPIRATION}
