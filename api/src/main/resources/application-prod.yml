spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate # 운영은 실수를 막기 위해 무조건 validate
    show-sql: false

  mail:
    host: ${PROD_MAIL_HOST:email-smtp.ap-northeast-2.amazonaws.com}
    port: ${PROD_MAIL_PORT:587}
    username: ${PROD_MAIL_USERNAME:}
    password: ${PROD_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${PROD_MAIL_FROM:no-reply@rhight.local}

cloud:
  s3:
    endpoint: ${PROD_S3_ENDPOINT}
    region: ${PROD_S3_REGION:ap-northeast-2}
    bucket: ${PROD_S3_BUCKET:rhight}
    credentials:
      access-key: ${PROD_S3_KEY}
      secret-key: ${PROD_S3_SECRET}
