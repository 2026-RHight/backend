spring:
  config:
    activate:
      on-profile: dev

  sql:
    init:
      mode: never

  datasource:
    url: ${DEV_DB_URL}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DEV_DB_USER}
    password: ${DEV_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        highlight_sql: true
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: Asia/Seoul

  mail:
    host: ${AWS_MAIL_HOST}
    port: ${AWS_MAIL_PORT}
    username: ${AWS_MAIL_USERNAME}
    password: ${AWS_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${AWS_MAIL_FROM}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

cloud:
  s3:
    endpoint: ${DEV_S3_ENDPOINT}
    region: ${DEV_S3_REGION}
    bucket: ${DEV_S3_BUCKET}
    credentials:
      access-key: ${DEV_S3_KEY}
      secret-key: ${DEV_S3_SECRET}

jwt:
  secret: ${DEV_JWT_SECRET}
  expiration: ${DEV_JWT_EXPIRATION}
  refresh-expiration: ${DEV_JWT_REFRESH_EXPIRATION}
