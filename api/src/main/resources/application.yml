spring:
  application:
    name: rhight-backend

  #  local? ????
  profiles:
    active: local

  # Spring Modulith ?? ??
  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
