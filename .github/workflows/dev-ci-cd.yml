name: Dev CI/CD

on:
  push:
    branches: ["dev"]

env:
  IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/rhight-backend-api
  DEV_CONTAINER_NAME: rhight-api-dev

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run api tests and build jar
        run: ./gradlew :api:test :api:bootJar --no-daemon

      - name: Upload api jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-boot-jar
          path: api/build/libs/*.jar
          if-no-files-found: error

  cd:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download api jar artifact
        uses: actions/download-artifact@v4
        with:
          name: api-boot-jar
          path: api/build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            PROFILE=dev
            CONTAINER_NAME=${{ env.DEV_CONTAINER_NAME }}
            echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
            docker pull ${{ env.IMAGE_REPO }}:${{ github.sha }}
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p 80:8080 \
              -e SPRING_PROFILES_ACTIVE=$PROFILE \
              -e DEV_DB_URL="${{ secrets.DEV_DB_URL }}" \
              -e DEV_DB_USER="${{ secrets.DEV_DB_USER }}" \
              -e DEV_DB_PASSWORD="${{ secrets.DEV_DB_PASSWORD }}" \
              -e DEV_REDIS_HOST="${{ secrets.DEV_REDIS_HOST }}" \
              -e DEV_REDIS_PORT="${{ secrets.DEV_REDIS_PORT }}" \
              -e DEV_REDIS_PASSWORD="${{ secrets.DEV_REDIS_PASSWORD }}" \
              -e SECURITY_HASH_PEPPER="${{ secrets.SECURITY_HASH_PEPPER }}" \
              -e SECURITY_ENC_KEY_BASE64="${{ secrets.SECURITY_ENC_KEY_BASE64 }}" \
              -e DEV_S3_ENDPOINT="${{ secrets.DEV_S3_ENDPOINT }}" \
              -e DEV_S3_REGION="${{ secrets.DEV_S3_REGION }}" \
              -e DEV_S3_BUCKET="${{ secrets.DEV_S3_BUCKET }}" \
              -e DEV_S3_KEY="${{ secrets.DEV_S3_KEY }}" \
              -e DEV_S3_SECRET="${{ secrets.DEV_S3_SECRET }}" \
              -e AWS_MAIL_HOST="${{ secrets.AWS_MAIL_HOST }}" \
              -e AWS_MAIL_PORT="${{ secrets.AWS_MAIL_PORT }}" \
              -e AWS_MAIL_USERNAME="${{ secrets.AWS_MAIL_USERNAME }}" \
              -e AWS_MAIL_PASSWORD="${{ secrets.AWS_MAIL_PASSWORD }}" \
              -e AWS_MAIL_FROM="${{ secrets.AWS_MAIL_FROM }}" \
              -e DEV_JWT_SECRET="${{ secrets.DEV_JWT_SECRET }}" \
              -e DEV_JWT_EXPIRATION="${{ secrets.DEV_JWT_EXPIRATION }}" \
              -e DEV_JWT_REFRESH_EXPIRATION="${{ secrets.DEV_JWT_REFRESH_EXPIRATION }}" \
              ${{ env.IMAGE_REPO }}:${{ github.sha }}
            docker image prune -f
